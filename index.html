
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Axiom Engine — Precision Builder. AI-powered building tools for Roblox Studio.">
  <title>Axiom Engine — Precision Builder</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #e6e6e8;
      --muted: #b8b8be;
      --purple: #a36aff;
      --border: #1b1b1e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 744px;
      margin: 0 auto;
      padding: 0 12px;
    }

    header {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--fg);
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand svg {
      color: var(--purple);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    nav a {
      color: #c5c5c9;
      text-decoration: none;
      font-size: 11px;
    }

    nav a:hover {
      color: #fff;
    }

    main {
      text-align: center;
      padding: 41px 0 0;
    }

    .eyebrow {
      color: var(--purple);
      font-size: 12px;
      margin: 0 0 16px;
    }

    h1 {
      font-size: 24px;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin: 0 0 13px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 14px;
      color: #c8c8cd;
      margin: 0 0 14px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 52px;
      padding: 0 14px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
      border: 1px solid #29292c;
      transition: background .15s, border-color .15s, transform .15s;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: #5a5a60;
    }

    .button.primary {
      background: #242426;
      border-color: #242426;
    }

    .button.primary:hover {
      background: #333336;
    }

    .button.secondary {
      background: transparent;
      font-weight: 400;
      border-color: #2b2b2f;
    }

    .button svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .release {
      color: #c8c8cd;
      font-size: 13px;
      margin: 14px 0 0;
    }

    @media (max-width: 520px) {
      .container {
        padding: 0 20px;
      }

      header {
        height: 88px;
      }

      .brand {
        font-size: 14px;
      }

      nav {
        gap: 10px;
      }

      main {
        padding-top: 60px;
      }

      h1 {
        font-size: 26px;
      }

      .subtitle, .release {
        line-height: 1.6;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <a class="brand" href="./">
        <svg width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linejoin="round">
          <path d="M12 2.5 20 7v10l-8 4.5L4 17V7l8-4.5Z"/>
          <path d="m4 7 8 4.5L20 7M12 11.5v10"/>
        </svg>
        AXIOM ENGINE
      </a>

      <nav>
        <a href="./">Home</a>
        <a href="https://github.com/jgzinhaooo/Roblox-Axiom-Engine/releases">
          Downloads
        </a>
        <a href="https://github.com/jgzinhaooo/Roblox-Axiom-Engine#readme">
          Docs
        </a>
      </nav>
    </header>

    <main>
      <p class="eyebrow">PRECISION BUILDER</p>

      <h1>Build Beyond Limits.</h1>

      <p class="subtitle">
        AI-powered building tools for Roblox Studio.
      </p>

      <div class="actions">
        <a class="button primary"
           href="https://github.com/jgzinhaooo/Roblox-Axiom-Engine/releases/latest">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/>
          </svg>
          Download Latest
        </a>

        <a class="button secondary"
           href="https://github.com/jgzinhaooo/Roblox-Axiom-Engine#readme">
          <svg viewBox="0 0 24 24">
            <path d="M12 6.5c-3-2-6-2-9-1v13c3-1 6-1 9 1 3-2 6-2 9-1v-13c-3-1-6-1-9 1Zm0 0v13"/>
          </svg>
          Documentation
        </a>
      </div>

      <p class="release">
        Latest stable release · Roblox Studio
      </p>
    </main>
  </div>
</body>
</html>
