
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Axiom Engine — AI-powered building tools for Roblox Studio.">
  <title>Axiom Engine — Precision Builder</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --fg: #e6e6e8;
      --muted: #b8b8be;
      --purple: #a36aff;
      --border: #1b1b1e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 744px;
      margin: 0 auto;
      padding: 0 12px;
    }

    header {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--fg);
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
    }

    .brand svg { color: var(--purple); }

    nav {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    nav a {
      color: #c5c5c9;
      text-decoration: none;
      font-size: 11px;
    }

    nav a:hover,
    footer a:hover {
      color: var(--purple);
    }

    main {
      text-align: center;
      padding: 41px 0 0;
    }

    .eyebrow {
      color: var(--purple);
      font-size: 12px;
      margin: 0 0 16px;
    }

    h1 {
      font-size: 24px;
      letter-spacing: -0.5px;
      margin: 0 0 13px;
    }

    .subtitle {
      color: #c8c8cd;
      font-size: 14px;
      margin: 0 0 14px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 52px;
      padding: 0 14px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-size: 14px;
      color: var(--fg);
      border: 1px solid #29292c;
      transition: 0.15s;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: var(--purple);
    }

    .primary {
      background: #242426;
      font-weight: 600;
    }

    .secondary {
      background: transparent;
    }

    .button svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .release {
      color: #c8c8cd;
      font-size: 13px;
      margin-top: 14px;
    }

    footer {
      margin-top: 90px;
      padding: 25px 0;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #777;
      font-size: 11px;
    }

    footer a {
      color: #999;
      text-decoration: none;
    }

    @media (max-width: 520px) {
      .container { padding: 0 20px; }
      header { height: 88px; }
      .brand { font-size: 13px; }
      nav { gap: 10px; }
      main { padding-top: 60px; }
      h1 { font-size: 26px; }
      .subtitle, .release { line-height: 1.6; }
      footer { flex-direction: column; text-align: center; }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <a class="brand" href="./">
        <svg width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linejoin="round">
          <path d="M12 2.5 20 7v10l-8 4.5L4 17V7l8-4.5Z"/>
          <path d="m4 7 8 4.5L20 7M12 11.5v10"/>
        </svg>
        AXIOM ENGINE
      </a>

      <nav>
        <a href="./">Home</a>
        <a href="https://github.com/jgzinhoooo/Roblox-Axiom-Engine/releases">Downloads</a>
        <a href="docs.html">Docs</a>
      </nav>
    </header>

    <main>
      <p class="eyebrow">PRECISION BUILDER</p>

      <h1>Build Beyond Limits.</h1>

      <p class="subtitle">
        AI-powered building tools for Roblox Studio.
      </p>

      <div class="actions">

        <a class="button primary"
           href="#" id="download-latest" aria-disabled="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/>
          </svg>
          Download Latest
        </a>

        <a class="button secondary" href="docs.html">
          <svg viewBox="0 0 24 24">
            <path d="M12 6.5c-3-2-6-2-9-1v13c3-1 6-1 9 1 3-2 6-2 9-1v-13c-3-1-6-1-9 1Zm0 0v13"/>
          </svg>
          Documentation
        </a>

      </div>

      <p class="release" id="release-status">
        Checking latest release · Roblox Studio
      </p>
    </main>

    <footer>
      <span>© 2026 Axiom Engine — 404 Studios br</span>
      <a href="https://github.com/jgzinhoooo/Roblox-Axiom-Engine/blob/main/LICENSE">
        License
      </a>
    </footer>

  </div>
  <script>
    const releasesApi = "https://api.github.com/repos/jgzinhoooo/Roblox-Axiom-Engine/releases/latest";
    const downloadButton = document.getElementById("download-latest");
    const releaseStatus = document.getElementById("release-status");

    async function setupDownload() {
      try {
        const response = await fetch(releasesApi, {
          headers: { "Accept": "application/vnd.github+json" }
        });
        if (!response.ok) throw new Error("No published release");
        const release = await response.json();
        const assets = release.assets || [];
        const asset = assets.find(a => /\.(rbxm|rbxmx|rbxl|rbxlx|zip)$/i.test(a.name))
                   || assets.find(a => !/\.(txt|md|json)$/i.test(a.name));
        if (!asset) {
          releaseStatus.textContent = "No downloadable plugin available yet";
          downloadButton.setAttribute("aria-disabled", "true");
          return;
        }
        downloadButton.href = asset.browser_download_url;
        downloadButton.removeAttribute("aria-disabled");
        releaseStatus.textContent = release.tag_name + " · " + asset.name;
      } catch (error) {
        releaseStatus.textContent = "Download coming soon · Roblox Studio";
        downloadButton.setAttribute("aria-disabled", "true");
      }
    }

    downloadButton.addEventListener("click", event => {
      if (downloadButton.getAttribute("aria-disabled") === "true") {
        event.preventDefault();
      }
    });

    setupDownload();
  </script>
</body>
</html>
